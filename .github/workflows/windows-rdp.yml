name: EnigMano Instance Deployment

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number'
        required: true
        default: '1'
        type: string

jobs:
  deploy-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Enable RDP
      shell: powershell
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

    - name: Create User
      shell: powershell
      run: |
        $Password = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin"

    - name: Download ngrok
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
        Expand-Archive ngrok.zip -DestinationPath C:\ngrok

    - name: Configure ngrok
      shell: powershell
      run: |
        C:\ngrok\ngrok.exe config add-authtoken ${{ secrets.NGROK_SHAHZAIB }}
        Write-Host "=== ngrok config ==="
        Get-Content "$env:USERPROFILE\AppData\Local\ngrok\ngrok.yml" -ErrorAction SilentlyContinue

    - name: Install build tools
      shell: powershell
      run: |
        choco install mingw -y
        choco install make -y

    - name: Start ngrok
      shell: powershell
      run: |
        Start-Process -FilePath "C:\ngrok\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout --log-format=logfmt" -RedirectStandardOutput C:\ngrok\ngrok.log -RedirectStandardError C:\ngrok\ngrok.err -WindowStyle Hidden
        Start-Sleep -Seconds 8
        Write-Host "=== ngrok stdout ==="
        if (Test-Path C:\ngrok\ngrok.log) { Get-Content C:\ngrok\ngrok.log }
        Write-Host "=== ngrok stderr ==="
        if (Test-Path C:\ngrok\ngrok.err) { Get-Content C:\ngrok\ngrok.err }

    - name: Show connection info
      shell: powershell
      run: |
        $tries = 0
        $hostOnly = $null
        while ($tries -lt 30 -and -not $hostOnly) {
          $tries++
          try {
            $ngrokApi = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -TimeoutSec 3
            if ($ngrokApi.tunnels.Count -gt 0) {
              $publicUrl = $ngrokApi.tunnels[0].public_url
              $hostOnly = $publicUrl -replace "tcp://", ""
            }
          } catch {
            Start-Sleep -Seconds 2
          }
        }
        if ($hostOnly) {
          Write-Host "========================="
          Write-Host "HOST=$hostOnly"
          Write-Host "USER=runneradmin"
          Write-Host "PASS=P@ssw0rd!"
          Write-Host "========================="
        } else {
          Write-Host "ngrok never came up. Check the previous step log."
          if (Test-Path C:\ngrok\ngrok.err) { Get-Content C:\ngrok\ngrok.err }
          if (Test-Path C:\ngrok\ngrok.log) { Get-Content C:\ngrok\ngrok.log }
          exit 1
        }

    - name: Keep alive
      shell: powershell
      run: |
        $i = 0
        while ($true) {
          $i++
          Write-Host "alive $i $(Get-Date)"
          Start-Sleep -Seconds 60
        }
