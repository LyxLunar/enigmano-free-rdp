name: EnigMano Instance Deployment

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number'
        required: true
        default: '1'
        type: string

jobs:
  deploy-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Enable RDP
      shell: powershell
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

    - name: Create User
      shell: powershell
      run: |
        $Password = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin"

    - name: Download ngrok
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
        Expand-Archive ngrok.zip -DestinationPath C:\ngrok

    - name: Configure ngrok
      shell: powershell
      run: |
        C:\ngrok\ngrok.exe config add-authtoken ${{ secrets.NGROK_SHAHZAIB }}

    - name: Install build tools
      shell: powershell
      run: |
        choco install mingw -y
        choco install make -y

    - name: Start ngrok
      shell: powershell
      run: |
        Start-Process -FilePath "C:\ngrok\ngrok.exe" -ArgumentList "tcp 3389" -WindowStyle Hidden
        Start-Sleep -Seconds 10

    - name: Show connection info
      shell: powershell
      run: |
        $ngrokApi = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels"
        $publicUrl = $ngrokApi.tunnels[0].public_url
        $hostOnly = $publicUrl -replace "tcp://", ""
        Write-Host "HOST=$hostOnly"
        Write-Host "USER=runneradmin"
        Write-Host "PASS=P@ssw0rd!"

    - name: Keep alive
      shell: powershell
      run: |
        $i = 0
        while ($true) {
          $i++
          Write-Host "alive $i $(Get-Date)"
          Start-Sleep -Seconds 60
        }
